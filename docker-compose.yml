version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ciphertrace-backend
    ports:
      - "8000:8000"
    environment:
      - AIRGAP_MODE=true
      - SQLITE_DB_PATH=/app/data/ciphertrace.db
    volumes:
      - ciphertrace-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ciphertrace-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ciphertrace-data:
