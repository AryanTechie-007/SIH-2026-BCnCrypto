[project]
name = "ciphertrace-worker"
version = "1.0.0"
description = "CIPHERTRACE's Python worker: post-quantum encryption, watermarking and forensics for the desktop app"
readme = "../README.md"
# 3.12+: numpy. Below 3.14: mlkem publishes wheels for 3.11-3.13 only.
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.1",
    "dilithium-py>=1.4.0",
    "greenlet>=3.5.6",
    "mlkem>=0.0.3",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "scipy>=1.18.1",
    "sqlalchemy>=2.1.1",
]

[dependency-groups]
# Installed by a plain `uv sync`; only needed to build the desktop installers.
dev = [
    "pyinstaller>=6.22.3",
]

[tool.uv]
# The worker runs from source (run_worker.py) or frozen by PyInstaller; it is not installed as a package.
package = false
